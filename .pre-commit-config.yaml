repos:
  # ── Python : Ruff (lint + format) ──────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ── Python : mypy ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^backend/app/
        args: [--ignore-missing-imports]
        additional_dependencies:
          - pydantic>=2
          - sqlalchemy[mypy]>=2

  # ── Sécurité : bandit ─────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-r", "backend/app", "-ll"]
        files: ^backend/

  # ── Génériques ────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: detect-private-key

  # ── Frontend : ESLint via lint-staged ─────────────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        language: node
        entry: bash -c 'cd frontend && pnpm lint'
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: tsc
        name: TypeScript check
        language: node
        entry: bash -c 'cd frontend && pnpm type-check'
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

  # ── Commits : message conventionnel ──────────────────────────────────────
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, docs, test, refactor, perf, build, ci]
