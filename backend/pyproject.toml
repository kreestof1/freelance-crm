[tool.poetry]
name = "crm-freelance-backend"
version = "0.1.0"
description = "CRM Freelance — API FastAPI"
authors = ["Christophe Barré"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.0" }
alembic = "^1.13.0"
pydantic-settings = "^2.4.0"
pydantic = { extras = ["email"], version = "^2.8.0" }
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["argon2"], version = "^1.7.4" }
asyncpg = "^0.29.0"
httpx = "^0.27.0"
slowapi = "^0.1.9"
structlog = "^24.4.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-instrumentation-fastapi = "^0.48b0"
opentelemetry-instrumentation-sqlalchemy = "^0.48b0"
opentelemetry-exporter-otlp = "^1.27.0"
azure-monitor-opentelemetry-exporter = "^1.0.0b28"
azure-identity = "^1.18.0"
azure-keyvault-secrets = "^4.8.0"
azure-storage-blob = "^12.23.0"
python-multipart = "^0.0.12"
email-validator = "^2.2.0"
apscheduler = "^3.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
factory-boy = "^3.3.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
bandit = "^1.7.9"
pip-audit = "^2.7.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
