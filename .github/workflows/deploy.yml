name: Deploy

on:
  push:
    branches: [main]           # → staging
    tags: ["v*.*.*"]           # → prod

  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        required: true
        default: staging
        type: choice
        options: [staging, prod]

jobs:
  # ── Détermination de l'environnement ────────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  # ── 1. Deploy Frontend → Azure Static Web Apps ──────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          api_location: ""
          output_location: dist
          app_build_command: "pnpm build"
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Smoke test frontend
        run: |
          sleep 15
          curl -f "${{ secrets.SWA_URL }}"

  # ── 2. Deploy Backend → Azure App Service ───────────────────────────────────
  deploy-backend:
    name: Deploy Backend (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push Docker image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image api:${{ github.sha }} \
            --image api:latest \
            backend/

      - name: Update App Service container image
        run: |
          az webapp config container set \
            --name ${{ secrets.APP_SERVICE_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --docker-custom-image-name ${{ secrets.ACR_LOGIN_SERVER }}/api:${{ github.sha }}

      - name: Staging slot swap (prod uniquement)
        if: needs.setup.outputs.environment == 'prod'
        run: |
          az webapp deployment slot swap \
            --name ${{ secrets.APP_SERVICE_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --slot staging \
            --target-slot production

      - name: Smoke test API
        run: |
          sleep 20
          curl -f "${{ secrets.API_URL }}/health"

  # ── 3. Migration DB ──────────────────────────────────────────────────────────
  migrate-db:
    name: Migration Alembic (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [setup, deploy-backend]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Alembic upgrade via Azure Container Instance
        run: |
          az container create \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name crm-migrate-${{ github.run_id }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/api:${{ github.sha }} \
            --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --command-line "alembic upgrade head" \
            --environment-variables \
              DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --restart-policy Never \
            --no-wait=false

      - name: Cleanup migration container
        if: always()
        run: |
          az container delete \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name crm-migrate-${{ github.run_id }} \
            --yes

  # ── 4. E2E Smoke Tests (staging uniquement) ──────────────────────────────────
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [setup, migrate-db]
    if: needs.setup.outputs.environment == 'staging'
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
        working-directory: frontend

      - name: Run E2E smoke tests
        run: pnpm test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.SWA_URL }}
          API_URL: ${{ secrets.API_URL }}

      - name: Rollback on failure
        if: failure()
        run: |
          echo "E2E failed — rollback slot swap"
          az webapp deployment slot swap \
            --name ${{ secrets.APP_SERVICE_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --slot staging \
            --target-slot production
